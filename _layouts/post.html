---
layout: default
---
<main id="main" class="article-page">
  <article class="shell article-shell">
    <a class="text-link article-back" href="{{ "/journal/" | relative_url }}">← All journal entries</a>
    <p class="eyebrow">{{ page.category | default: "JOURNAL" | upcase }} · {{ page.date | date: "%d %B %Y" }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="article-intro">{{ page.description }}</p>{% endif %}
    <div class="article-body">{{ content }}</div>
    <a class="text-link article-back" href="{{ "/journal/" | relative_url }}">← Back to the journal</a>
  </article>
</main>
